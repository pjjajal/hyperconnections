exp_name: identity_hc

data:
  n_samples_per_grid: 500
  n_grids: 200
  n_rows: 4
  n_cols: 4
  n_colours: 2
  trajectory_length: 12
  ambiguous_threshold: 0.75
  final_unique: true
  seed: 42

model:
  dim: 128
  num_heads: 4
  ffn_ratio: 4
  num_layers: 6
  qkv_bias: false
  proj_bias: true
  hc:
    type: identity_hc
    n: 4
    m: 1
    bias: false
    elementwise_affine: false

training:
  batch_size: 128
  epochs: 50
  lr: 3e-4
  weight_decay: 0.01
  device: auto

logging:
  log_dir: experiments/synthetic_grid_world/runs
  run_name: null
