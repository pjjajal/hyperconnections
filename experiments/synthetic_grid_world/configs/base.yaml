exp_name: base

data:
  n_samples_per_grid: 5000
  n_grids: 5
  n_rows: 6
  n_cols: 6
  n_colours: 3
  trajectory_length: 12
  ambiguous_threshold: 0.50
  final_unique: true
  seed: 532

model:
  dim: 64
  num_heads: 4
  ffn_ratio: 4
  num_layers: 12
  qkv_bias: false
  proj_bias: true
  hc:
    type: null

training:
  batch_size: 128
  epochs: 50
  lr: 3e-4
  weight_decay: 0.01
  device: auto

logging:
  log_dir: experiments/synthetic_grid_world/runs
  run_name: null
